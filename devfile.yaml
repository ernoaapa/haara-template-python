schemaVersion: 2.2.0
metadata:
  name: python-app
  language: python
  projectType: python
components:
  - name: runtime
    container:
      image: python:3.12-alpine
      mountSources: true
      endpoints:
        - name: http
          targetPort: 8000
commands:
  - id: dev
    exec:
      component: runtime
      commandLine: pip install -r requirements.txt && uvicorn main:app --host 0.0.0.0 --port 8000 --reload
      group:
        kind: run
        isDefault: true
